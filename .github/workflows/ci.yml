name: CI

on:
  push:
    branches: [main, "claude/**", "feat/**", "fix/**"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 2 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --extra dev --extra mcp --extra api --extra browser
      - run: uv run ruff check civic_stack/ tests/ scripts/ examples/ app.py server.py
      - run: uv run ruff format --check civic_stack/ tests/ scripts/ examples/ app.py server.py
      - run: uv run mypy civic_stack/
      - name: Audit installed locked dependencies
        run: uvx pip-audit --path "$(uv run python -c 'import sysconfig; print(sysconfig.get_path("purelib"))')" --progress-spinner off

  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked --extra dev --extra mcp --extra api --extra browser
      - name: Run tests (VCR replay, skip browser-dependent modules)
        run: |
          uv run pytest tests/ -v --tb=short \
            --ignore=tests/ahu \
            --ignore=tests/bpjph \
            --ignore=tests/oss-nib \
            --ignore=tests/lhkpn
        env:
          VCR_RECORD_MODE: none

  test-browser:
    name: Tests (browser modules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --extra dev --extra browser
      - run: uv run playwright install chromium --with-deps
      - name: Run offline browser-module regression tests
        run: |
          uv run pytest tests/ahu tests/bpjph tests/oss-nib tests/lhkpn -v --tb=short
        env:
          VCR_RECORD_MODE: none


  release-package:
    name: Build package & validate Agent Skill
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv build
      - name: Smoke-test core-only wheel installation
        run: |
          uv venv "$RUNNER_TEMP/civic-core"
          uv pip install --python "$RUNNER_TEMP/civic-core/bin/python" dist/*.whl
          "$RUNNER_TEMP/civic-core/bin/python" -I -c 'import civic_stack; from civic_stack import bpom; assert callable(bpom.search)'
          "$RUNNER_TEMP/civic-core/bin/civic-stack" --version
      - name: Validate portable skill (pinned upstream reference validator)
        run: |
          mkdir -p "$RUNNER_TEMP/skill-validation/indonesia-civic-stack"
          cp SKILL.md LICENSE "$RUNNER_TEMP/skill-validation/indonesia-civic-stack/"
          cp -R references "$RUNNER_TEMP/skill-validation/indonesia-civic-stack/"
          uvx --from "git+https://github.com/agentskills/agentskills.git@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref" \
            skills-ref validate "$RUNNER_TEMP/skill-validation/indonesia-civic-stack"
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*

  openapi:
    name: Export OpenAPI spec
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --extra dev --extra api --extra browser
      - run: uv run python scripts/export_openapi.py
      - uses: actions/upload-artifact@v4
        with:
          name: openapi-spec
          path: docs/openapi.json

  live-portal-check:
    name: Live portal regression check
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --extra dev --extra browser
      - name: Run live integration tests
        run: uv run python scripts/test_module.py --live
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
        continue-on-error: true
